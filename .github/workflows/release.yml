---
# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Build and publish packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify package versions and tag identity
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: python tools/check_release.py

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
          version: 0.12.7

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the combined release gate
        run: npm run test:release

      - name: Fail on dependency vulnerabilities
        run: |
          npm audit --audit-level=high
          uvx pip-audit@2.10.1 .

  build:
    name: Build immutable distributions
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
          version: 0.12.7

      - name: Build npm and Python distributions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p release/npm release/python
          npm pack --ignore-scripts --pack-destination release/npm
          uvx --from build@1.6.0 pyproject-build --outdir release/python
          uvx twine@7.0.0 check release/python/*
          sha256sum release/npm/* release/python/* > release/SHA256SUMS

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-distributions
          path: release
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest built distributions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Verify downloaded release distributions
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          fail() { printf 'Release archive verification failed: %s\n' "$1" >&2; exit 1; }
          for directory in release release/npm release/python; do
            [[ -d "$directory" && ! -L "$directory" ]] || fail "Missing or unsafe distribution directory"
          done
          [[ -f release/SHA256SUMS && ! -L release/SHA256SUMS ]] || fail "Missing or unsafe checksum manifest"
          [[ -z "$(find release/npm release/python ! -type d ! -type f -print -quit)" ]] || fail "Nonregular distribution entry"
          checksum_directory="$(mktemp -d)"
          trap 'rm -rf "$checksum_directory"' EXIT
          checksum_pattern='^[[:xdigit:]]{64} [ *](release/(npm|python)/[[:alnum:]_.+-]+)$'
          while IFS= read -r entry || [[ -n "$entry" ]]; do
            [[ "$entry" =~ $checksum_pattern ]] || fail "Invalid checksum entry or distribution path"
            printf '%s\n' "${BASH_REMATCH[1]}" >> "$checksum_directory/manifest"
          done < release/SHA256SUMS
          [[ -s "$checksum_directory/manifest" ]] || fail "Empty checksum manifest"
          sort "$checksum_directory/manifest" > "$checksum_directory/expected"
          [[ -z "$(uniq -d "$checksum_directory/expected")" ]] || fail "Duplicate checksum entry"
          find release/npm release/python -type f -print0 | sort -z > "$checksum_directory/actual"
          tr '\n' '\0' < "$checksum_directory/expected" > "$checksum_directory/expected-null"
          cmp "$checksum_directory/expected-null" "$checksum_directory/actual" || fail "Distribution files differ from checksum manifest"
          sha256sum --check --strict release/SHA256SUMS

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/**/*

  publish-npm:
    name: Publish npm through trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: npm
      url: https://www.npmjs.com/package/@nymrel/proof-ledger
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Verify downloaded release distributions
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          fail() { printf 'Release archive verification failed: %s\n' "$1" >&2; exit 1; }
          for directory in release release/npm release/python; do
            [[ -d "$directory" && ! -L "$directory" ]] || fail "Missing or unsafe distribution directory"
          done
          [[ -f release/SHA256SUMS && ! -L release/SHA256SUMS ]] || fail "Missing or unsafe checksum manifest"
          [[ -z "$(find release/npm release/python ! -type d ! -type f -print -quit)" ]] || fail "Nonregular distribution entry"
          checksum_directory="$(mktemp -d)"
          trap 'rm -rf "$checksum_directory"' EXIT
          checksum_pattern='^[[:xdigit:]]{64} [ *](release/(npm|python)/[[:alnum:]_.+-]+)$'
          while IFS= read -r entry || [[ -n "$entry" ]]; do
            [[ "$entry" =~ $checksum_pattern ]] || fail "Invalid checksum entry or distribution path"
            printf '%s\n' "${BASH_REMATCH[1]}" >> "$checksum_directory/manifest"
          done < release/SHA256SUMS
          [[ -s "$checksum_directory/manifest" ]] || fail "Empty checksum manifest"
          sort "$checksum_directory/manifest" > "$checksum_directory/expected"
          [[ -z "$(uniq -d "$checksum_directory/expected")" ]] || fail "Duplicate checksum entry"
          find release/npm release/python -type f -print0 | sort -z > "$checksum_directory/actual"
          tr '\n' '\0' < "$checksum_directory/expected" > "$checksum_directory/expected-null"
          cmp "$checksum_directory/expected-null" "$checksum_directory/actual" || fail "Distribution files differ from checksum manifest"
          sha256sum --check --strict release/SHA256SUMS

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require npm trusted-publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            console.error(`npm ${process.argv[2]} cannot use trusted publishing; require >=11.5.1`);
            process.exit(1);
          }
          NODE

      - name: Publish the exact npm archive with provenance
        run: |
          mapfile -t packages < <(find release/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts

  publish-pypi:
    name: Publish PyPI through trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/nymrel-proof-ledger/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-distributions
          path: release

      - name: Verify downloaded release distributions
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          fail() { printf 'Release archive verification failed: %s\n' "$1" >&2; exit 1; }
          for directory in release release/npm release/python; do
            [[ -d "$directory" && ! -L "$directory" ]] || fail "Missing or unsafe distribution directory"
          done
          [[ -f release/SHA256SUMS && ! -L release/SHA256SUMS ]] || fail "Missing or unsafe checksum manifest"
          [[ -z "$(find release/npm release/python ! -type d ! -type f -print -quit)" ]] || fail "Nonregular distribution entry"
          checksum_directory="$(mktemp -d)"
          trap 'rm -rf "$checksum_directory"' EXIT
          checksum_pattern='^[[:xdigit:]]{64} [ *](release/(npm|python)/[[:alnum:]_.+-]+)$'
          while IFS= read -r entry || [[ -n "$entry" ]]; do
            [[ "$entry" =~ $checksum_pattern ]] || fail "Invalid checksum entry or distribution path"
            printf '%s\n' "${BASH_REMATCH[1]}" >> "$checksum_directory/manifest"
          done < release/SHA256SUMS
          [[ -s "$checksum_directory/manifest" ]] || fail "Empty checksum manifest"
          sort "$checksum_directory/manifest" > "$checksum_directory/expected"
          [[ -z "$(uniq -d "$checksum_directory/expected")" ]] || fail "Duplicate checksum entry"
          find release/npm release/python -type f -print0 | sort -z > "$checksum_directory/actual"
          tr '\n' '\0' < "$checksum_directory/expected" > "$checksum_directory/expected-null"
          cmp "$checksum_directory/expected-null" "$checksum_directory/actual" || fail "Distribution files differ from checksum manifest"
          sha256sum --check --strict release/SHA256SUMS

      - name: Publish the exact Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: release/python
          print-hash: true
