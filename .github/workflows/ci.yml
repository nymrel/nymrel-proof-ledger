---
# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 2'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || 'normal' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The build runs the same strict compiler checks as typecheck.
      - name: Build, type-check, and test
        run: npm test

      - name: Inspect the npm package boundary
        run: npm pack --dry-run --ignore-scripts

  python:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bounded runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "cryptography>=50.0.1,<51" "rfc8785==0.1.4"

      - name: Run the Python suite
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s test/python -p 'test_*.py'

  security:
    name: Supply-chain and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            package.json
            .github/workflows/*.yml
          version: 0.12.7

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Audit Python dependencies
        run: uvx pip-audit@2.10.1 .

      - name: Check Python correctness rules
        run: uvx ruff@0.16.5 check --select E4,E7,E9,F python test tools

      - name: Verify authentication across actual Node and Python runtimes
        run: npm run test:cross

      - name: Audit GitHub Actions definitions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          online-audits: true
          persona: auditor
          version: 1.29.0
